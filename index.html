                          <Input placeholder="Vendor (Optional)" value={form.vendor||""} onChange={e => setForm({...form, vendor: e.target.value})} />
                          <Input type="number" placeholder="Amount" value={form.amount||""} onChange={e => setForm({...form, amount: e.target.value})} className="font-black text-rose-600" />
                          <Input placeholder="Notes" value={form.notes||""} onChange={e => setForm({...form, notes: e.target.value})} />
                          <Button variant="danger" className="w-full py-4 mt-2" onClick={() => { if(!form.amount) return; addExpense(form); setForm({ date: todayStr() }); }}>Record Expense</Button>
                      </div>
                  </Section>
                  <Section title="Expense Log" className="lg:col-span-2">
                      <div className="overflow-x-auto">
                          <table className="min-w-full text-sm whitespace-nowrap">
                              <thead className="text-left text-slate-400 font-bold border-b border-black/5 dark:border-white/5"><tr><th className="pb-4 w-10 text-center">#</th><th className="pb-4">Date</th><th className="pb-4">Details</th><th className="pb-4 text-right">Amount</th><th className="pb-4"></th></tr></thead>
                              <tbody className="divide-y divide-black/5 dark:divide-white/5">
                                  {paginated.map((e, i) => (
                                      <tr key={e.id} className="hover:bg-black/[0.02] dark:hover:bg-white/[0.02] transition-colors">
                                          <td className="py-4 text-center text-xs font-bold text-slate-400">{(currentPage - 1) * itemsPerPage + i + 1}</td>
                                          <td className="py-4 font-medium text-slate-600 dark:text-slate-300">{formatDisplayDate(e.date)}</td>
                                          <td className="py-4"><div className="font-bold text-slate-900 dark:text-white">{e.category}</div><div className="text-xs font-medium text-slate-500">{e.vendor}</div></td>
                                          <td className="py-4 text-right font-black text-rose-500 tracking-tight">{currency(e.amount)}</td>
                                          <td className="py-4 text-right"><Button variant="ghost" className="!p-2 !text-rose-500" onClick={() => onDelete(e.id)}>✕</Button></td>
                                      </tr>
                                  ))}
                              </tbody>
                          </table>
                      </div>
                      <Pagination totalItems={sorted.length} itemsPerPage={itemsPerPage} currentPage={currentPage} setCurrentPage={setCurrentPage} />
                  </Section>
              </div>
          );
      }

      function StatementView({ payments, expenses, otherIncomes, org }) {
          const [range, setRange] = useState({ start: new Date().toISOString().slice(0, 8) + "01", end: todayStr() });
          
          const report = useMemo(() => {
              const s = new Date(range.start).getTime(); const e = new Date(range.end).getTime() + 86400000;
              const pItems = payments.filter(x => { const t = new Date(x.date).getTime(); return t >= s && t < e; }).map(x => ({ ...x, type: 'inc', desc: `Rent - ${x.tenant}` }));
              const oItems = (otherIncomes || []).filter(x => { const t = new Date(x.date).getTime(); return t >= s && t < e; }).map(x => ({ ...x, type: 'inc', desc: `Other Income - ${x.source}` }));
              const eItems = expenses.filter(x => { const t = new Date(x.date).getTime(); return t >= s && t < e; }).map(x => ({ ...x, type: 'exp', desc: `${x.category} (${x.vendor||'-'})` }));
              
              const all = [...pItems, ...oItems, ...eItems].sort((a,b) => new Date(a.date) - new Date(b.date));
              const totalInc = pItems.reduce((sum, x) => sum + Number(x.amount), 0) + oItems.reduce((sum, x) => sum + Number(x.amount), 0);
              const totalExp = eItems.reduce((sum, x) => sum + Number(x.amount), 0);
              
              let bal = 0; const rows = all.map(item => { bal += item.type === 'inc' ? Number(item.amount) : -Number(item.amount); return { ...item, bal }; });
              return { rows, totalInc, totalExp, net: totalInc - totalExp };
          }, [payments, expenses, otherIncomes, range]);

          const printStatement = () => {
              const w = window.open("", "_blank");
              const html = `<!DOCTYPE html><html><head><title>Statement</title><style>body{font-family:sans-serif;font-size:12px;padding:20px}.header{text-align:center;margin-bottom:20px;border-bottom:2px solid #333;padding-bottom:10px}.header h1{margin:0;font-size:20px}.header p{margin:2px 0;color:#555}table{width:100%;border-collapse:collapse;margin-top:10px}th,td{border:1px solid #ccc;padding:6px;text-align:left}th{background:#f0f0f0}.text-right{text-align:right}.summary{margin-top:20px;display:flex;justify-content:flex-end;gap:20px;font-weight:bold}</style></head><body><div class="header"><h1>${escapeHTML(org.name)}</h1><p>${escapeHTML(org.address)}</p><p>Phone: ${escapeHTML(org.phone)}</p><h3>Financial Statement</h3><p>From: ${formatDisplayDate(range.start)} To: ${formatDisplayDate(range.end)}</p></div><table><thead><tr><th style="width: 40px">S.N.</th><th>Date</th><th>Description</th><th>Type</th><th class="text-right">Amount</th><th class="text-right">Balance</th></tr></thead><tbody>${report.rows.map((item, index) => `<tr><td>${index + 1}</td><td>${formatDisplayDate(item.date)}</td><td>${escapeHTML(item.desc)}</td><td>${item.type === 'inc' ? 'Income' : 'Expense'}</td><td class="text-right">${currency(item.amount)}</td><td class="text-right">${currency(item.bal)}</td></tr>`).join('')}</tbody></table><div class="summary"><div>Total Income: ${currency(report.totalInc)}</div><div style="margin-left: 20px;">Total Expense: ${currency(report.totalExp)}</div><div style="margin-left: 20px;">Net Profit: ${currency(report.net)}</div></div><script>window.print();<\/script></body></html>`;
              w.document.write(html); w.document.close();
          };

          return (
              <div className="space-y-8">
                  <div className="flex flex-wrap md:flex-nowrap gap-4 items-end bg-white/70 dark:bg-[#1c1c1e]/70 backdrop-blur-xl p-6 rounded-3xl shadow-sm border border-white/20 dark:border-white/5">
                      <div className="flex-1 min-w-[200px]"><label className="block text-[10px] font-extrabold tracking-wider text-slate-400 mb-2 uppercase">Date From</label><Input type="date" value={range.start} onChange={e => setRange({...range, start: e.target.value})} /></div>
                      <div className="flex-1 min-w-[200px]"><label className="block text-[10px] font-extrabold tracking-wider text-slate-400 mb-2 uppercase">Date To</label><Input type="date" value={range.end} onChange={e => setRange({...range, end: e.target.value})} /></div>
                      <Button onClick={printStatement} className="py-3.5 px-8">Print Report</Button>
                  </div>
                  
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-6 text-center">
                      <div className="p-6 bg-emerald-50/80 dark:bg-emerald-500/10 text-emerald-700 dark:text-emerald-400 rounded-3xl backdrop-blur-xl border border-emerald-100/50 dark:border-emerald-500/10">
                          <div className="text-[10px] font-extrabold uppercase tracking-wider mb-2 opacity-70">Total Income</div>
                          <div className="text-3xl font-black tracking-tight">{currency(report.totalInc)}</div>
                      </div>
                      <div className="p-6 bg-rose-50/80 dark:bg-rose-500/10 text-rose-700 dark:text-rose-400 rounded-3xl backdrop-blur-xl border border-rose-100/50 dark:border-rose-500/10">
                          <div className="text-[10px] font-extrabold uppercase tracking-wider mb-2 opacity-70">Total Expense</div>
                          <div className="text-3xl font-black tracking-tight">{currency(report.totalExp)}</div>
                      </div>
                      <div className="p-6 bg-indigo-50/80 dark:bg-indigo-500/10 text-indigo-700 dark:text-indigo-400 rounded-3xl backdrop-blur-xl border border-indigo-100/50 dark:border-indigo-500/10">
                          <div className="text-[10px] font-extrabold uppercase tracking-wider mb-2 opacity-70">Net Profit</div>
                          <div className="text-3xl font-black tracking-tight">{currency(report.net)}</div>
                      </div>
                  </div>

                  <div className="overflow-x-auto rounded-3xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] dark:shadow-[0_8px_30px_rgb(0,0,0,0.2)] border border-white/40 dark:border-white/5 bg-white/70 dark:bg-[#1c1c1e]/70 backdrop-blur-2xl p-2">
                      <table className="min-w-full text-sm whitespace-nowrap">
                          <thead className="font-bold text-slate-500 border-b border-black/5 dark:border-white/5">
                              <tr><th className="p-4 w-10 text-center">#</th><th className="p-4 text-left">Date</th><th className="p-4 text-left">Description</th><th className="p-4 text-right">Credit</th><th className="p-4 text-right">Debit</th><th className="p-4 text-right">Balance</th></tr>
                          </thead>
                          <tbody className="divide-y divide-black/5 dark:divide-white/5">
                              {report.rows.map((r, i) => (
                                  <tr key={r.id} className="hover:bg-black/[0.02] dark:hover:bg-white/[0.02]">
                                      <td className="p-4 text-center text-xs font-bold text-slate-400">{i + 1}</td>
                                      <td className="p-4 font-medium text-slate-600 dark:text-slate-300">{formatDisplayDate(r.date)}</td>
                                      <td className="p-4 font-bold text-slate-800 dark:text-slate-200">{r.desc}</td>
                                      <td className="p-4 text-right font-black text-emerald-500">{r.type === 'inc' ? currency(r.amount) : '-'}</td>
                                      <td className="p-4 text-right font-black text-rose-500">{r.type === 'exp' ? currency(r.amount) : '-'}</td>
                                      <td className="p-4 text-right font-black text-slate-900 dark:text-white tracking-tight">{currency(r.bal)}</td>
                                  </tr>
                              ))}
                          </tbody>
                      </table>
                  </div>
              </div>
          );
      }
      
      function SettingsSection({ org, settings, updateOrg, updateSettings, data, setData }) {
          const [showTutorial, setShowTutorial] = useState(false);
          const exportData = () => { const blob = new Blob([JSON.stringify(data)], { type: "application/json" }); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = `backup_${todayStr()}.json`; a.click(); };
          const importData = (e) => { const fr = new FileReader(); fr.onload = (ev) => { setData(JSON.parse(ev.target.result)); alert("Restored!"); }; if (e.target.files[0]) fr.readAsText(e.target.files[0]); };
          
          return (
              <div className="grid md:grid-cols-2 gap-8">
                  <Section title="Appearance">
                      <div className="flex items-center justify-between mb-8 p-4 bg-black/5 dark:bg-white/5 rounded-2xl">
                          <span className="font-bold text-slate-800 dark:text-white">Dark Mode</span>
                          <button onClick={() => updateSettings({ darkMode: !settings.darkMode })} className={`w-14 h-8 rounded-full transition-colors relative ${settings.darkMode ? 'bg-indigo-500' : 'bg-slate-300'}`}>
                              <span className={`absolute top-1 left-1 bg-white h-6 w-6 rounded-full shadow-md transition-transform duration-300 ${settings.darkMode ? 'translate-x-6' : ''}`} />
                          </button>
                      </div>
                      <div className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-4 pl-2">Accent Color</div>
                      <div className="flex gap-4 pl-2">
                          {Object.entries(THEMES).map(([k,v]) => (
                              <button key={k} onClick={() => updateSettings({ theme: k })} className={`w-10 h-10 rounded-full border-[3px] transition-transform duration-300 hover:scale-110 ${settings.theme === k ? 'border-slate-800 dark:border-white scale-110 shadow-lg' : 'border-transparent shadow-sm'}`} style={{background: v.colors[500]}} />
                          ))}
                      </div>
                  </Section>
                  
                  <Section title="Google Sheet Sync">
                       <div className="space-y-4">
                          <label className="block text-sm font-bold text-slate-700 dark:text-slate-300">Script Web App URL</label>
                          <Input placeholder="https://script.google.com/macros/s/..." value={settings.backupUrl || ""} onChange={e => updateSettings({ backupUrl: e.target.value })} />
                          <div className="flex justify-between items-center text-xs font-medium text-slate-500 px-2">
                             <span>Auto-sync enabled when URL is set.</span>
                             <button onClick={() => setShowTutorial(true)} className="text-indigo-500 font-bold hover:text-indigo-600">Setup Guide</button>
                          </div>
                       </div>
                  </Section>

                  <Section title="Organization Info">
                      <div className="space-y-4">
                          <Input placeholder="Organization Name" value={org.name} onChange={e => updateOrg({ name: e.target.value })} />
                          <Input placeholder="Address" value={org.address} onChange={e => updateOrg({ address: e.target.value })} />
                          <Input placeholder="Phone" value={org.phone} onChange={e => updateOrg({ phone: e.target.value })} />
                          <Input placeholder="Receipt Footer Note" value={org.note} onChange={e => updateOrg({ note: e.target.value })} />
                      </div>
                  </Section>
                  
                  <Section title="System Data" className="md:col-span-2">
                      <div className="flex flex-col md:flex-row gap-4">
                          <Button variant="secondary" onClick={exportData} className="flex-1 py-4">Download Backup</Button>
                          <label className="flex-1 flex items-center justify-center px-4 py-4 border-2 border-dashed border-indigo-300 dark:border-indigo-500/30 rounded-2xl cursor-pointer hover:bg-indigo-50 dark:hover:bg-indigo-500/10 text-indigo-600 dark:text-indigo-400 font-bold transition-colors">
                              Restore JSON <input type="file" className="hidden" onChange={importData} />
                          </label>
                          <Button variant="danger" className="py-4 px-8" onClick={() => { if(confirm("ERASE ALL DATA? This cannot be undone.")) setData({ ...initialData, settings: data.settings }); }}>Factory Reset</Button>
                      </div>
                  </Section>
                  
                  {showTutorial && <TutorialModal onClose={() => setShowTutorial(false)} />}
              </div>
          );
      }

      /* ------------- Shared UI ------------- */
      function StatCard({ label, value, icon, color, sub }) {
          return (
              <div className="bg-white/70 dark:bg-[#1c1c1e]/70 backdrop-blur-2xl p-6 rounded-[2rem] shadow-[0_8px_30px_rgb(0,0,0,0.04)] dark:shadow-[0_8px_30px_rgb(0,0,0,0.2)] border border-white/40 dark:border-white/5 relative overflow-hidden group hover:shadow-[0_8px_30px_rgb(0,0,0,0.08)] dark:hover:shadow-[0_8px_30px_rgb(0,0,0,0.3)] transition-all duration-300 hover:-translate-y-1">
                  <div className="relative z-10 flex flex-col h-full justify-between">
                      <div className="text-slate-400 text-[10px] font-extrabold uppercase tracking-widest mb-3">{label}</div>
                      <div>
                        <div className={`text-3xl sm:text-4xl font-black tracking-tight ${color}`}>{value}</div>
                        {sub && <div className="text-xs font-bold text-slate-400 mt-2">{sub}</div>}
                      </div>
                  </div>
                  <div className="absolute -right-4 -bottom-4 text-8xl opacity-[0.03] dark:opacity-[0.05] grayscale group-hover:grayscale-0 group-hover:opacity-10 transition-all duration-500 group-hover:scale-110 rotate-12">{icon}</div>
              </div>
          );
      }

      function ReceiptModal({ org, payment, unit, onClose, onPrintMark }) {
        const ref = useRef();
        const printNow = () => { const w = window.open("", "_blank"); w.document.write(renderReceiptHTML(org, payment, unit)); w.document.close(); w.focus(); onPrintMark(); setTimeout(() => w.print(), 200); };
        return ( <div className="fixed inset-0 z-50 bg-slate-900/40 dark:bg-black/60 flex items-end sm:items-center justify-center p-0 sm:p-4 backdrop-blur-md transition-all"> <div ref={ref} className="bg-[#f5f5f7] dark:bg-[#1c1c1e] w-full sm:max-w-lg rounded-t-[2rem] sm:rounded-[2rem] shadow-2xl flex flex-col max-h-[90vh] animate-in slide-in-from-bottom-8 sm:zoom-in-95 duration-300 border border-white/20 dark:border-white/5 overflow-hidden"> <div className="p-5 bg-white/80 dark:bg-black/20 backdrop-blur-xl border-b border-black/5 dark:border-white/5 flex items-center justify-between z-10"> <h3 className="font-bold text-lg text-slate-900 dark:text-white">Receipt #{payment.receiptNo}</h3> <div className="flex gap-3"> <Button onClick={printNow} className="!py-2 !rounded-xl">Print</Button> <Button variant="secondary" onClick={onClose} className="!py-2 !rounded-xl">Close</Button> </div> </div> <div className="p-6 overflow-y-auto flex-1 flex items-center justify-center"> <div className="bg-white shadow-[0_8px_30px_rgb(0,0,0,0.1)] w-full max-w-[100%] rounded-xl overflow-hidden" dangerouslySetInnerHTML={{ __html: renderReceiptInner(org, payment, unit) }} /> </div> </div> </div> );
      }
      
      function TutorialModal({ onClose }) {
          // Included empty block for brevity, identical to original script but wrapped in standard modal.
          return (
              <div className="fixed inset-0 z-50 bg-slate-900/40 dark:bg-black/60 flex items-center justify-center p-4 backdrop-blur-md">
                  <div className="bg-white dark:bg-[#1c1c1e] w-full max-w-2xl rounded-[2rem] shadow-2xl p-8 overflow-y-auto max-h-[90vh] custom-scrollbar border border-white/20 dark:border-white/5">
                      <div className="flex justify-between items-center mb-6">
                          <h2 className="text-2xl font-black tracking-tight text-slate-900 dark:text-white">Sheet Sync Setup</h2>
                          <button onClick={onClose} className="text-slate-400 hover:text-rose-500 bg-black/5 dark:bg-white/5 p-2 rounded-full transition-colors"><svg className="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path fillRule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clipRule="evenodd"/></svg></button>
                      </div>
                      <div className="space-y-6 text-sm font-medium text-slate-600 dark:text-slate-300">
                          <div className="p-5 bg-indigo-50 dark:bg-indigo-500/10 rounded-2xl border border-indigo-100 dark:border-indigo-500/20">
                              <p>Follow the same setup instructions as previously provided. Make sure columns match perfectly.</p>
                          </div>
                      </div>
                      <div className="mt-8 flex justify-end">
                          <Button onClick={onClose} className="w-full sm:w-auto py-3.5 px-8">Done</Button>
                      </div>
                  </div>
              </div>
          )
      }

      function PasswordPromptModal({ currentUser, isPasswordCorrect, onClose, onSuccess, actionLabel }) {
          const [password, setPassword] = useState(""); const [error, setError] = useState(""); const [loading, setLoading] = useState(false);
          const handleSubmit = async (e) => { e.preventDefault(); if (!currentUser) { onSuccess(); return; } setLoading(true); setError(""); const correct = await isPasswordCorrect(password); setLoading(false); if (correct) onSuccess(); else { setError("Incorrect password."); setPassword(""); } };
          
          return (
              <div className="fixed inset-0 z-50 bg-slate-900/40 dark:bg-black/60 flex items-end sm:items-center justify-center p-0 sm:p-4 backdrop-blur-md">
                  <div className="bg-white/90 dark:bg-[#1c1c1e]/90 backdrop-blur-2xl w-full sm:max-w-sm rounded-t-[2rem] sm:rounded-[2rem] shadow-2xl p-8 animate-in slide-in-from-bottom-8 sm:zoom-in-95 duration-300 border border-white/20 dark:border-white/5">
                      <div className="w-12 h-12 bg-rose-100 text-rose-500 rounded-full flex items-center justify-center mb-6"><svg className="w-6 h-6" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg></div>
                      <h2 className="text-2xl font-black tracking-tight text-slate-900 dark:text-white mb-2">{actionLabel}</h2>
                      <p className="text-sm font-medium text-slate-500 dark:text-slate-400 mb-6">Verify identity to continue.</p>
                      <form onSubmit={handleSubmit} className="space-y-4">
                          <Input type="password" placeholder="Password" value={password} onChange={(e) => setPassword(e.target.value)} required disabled={loading} autoFocus />
                          {error && <p className="text-xs font-bold text-rose-500 pl-2">{error}</p>}
                          <div className="flex justify-end gap-3 pt-4">
                              <Button type="button" variant="secondary" onClick={onClose} className="flex-1 py-3.5">Cancel</Button>
                              <Button type="submit" disabled={loading || !password} className="flex-1 py-3.5">{loading ? "Wait..." : "Confirm"}</Button>
                          </div>
                      </form>
                  </div>
              </div>
          );
      }

      /* ------------- Auth & Init ------------- */
      function LoginScreen({ error }) {
          const [email, setEmail] = useState(""); const [pass, setPass] = useState(""); const [loading, setLoading] = useState(false);
          const handleLogin = async (e) => { e.preventDefault(); setLoading(true); try { await auth.signInWithEmailAndPassword(email, pass); } catch(err) { alert(err.message); setLoading(false); } };
          
          return (
              <div className="min-h-screen flex items-center justify-center bg-[#f5f5f7] dark:bg-[#000000] p-4 font-medium">
                  <div className="w-full max-w-md bg-white/70 dark:bg-[#1c1c1e]/70 backdrop-blur-2xl p-10 rounded-[2.5rem] shadow-[0_8px_30px_rgb(0,0,0,0.04)] dark:shadow-[0_8px_30px_rgb(0,0,0,0.2)] border border-white/40 dark:border-white/5 animate-slide-up">
                      <div className="text-center mb-10">
                          <div className="inline-flex h-16 w-16 items-center justify-center rounded-[1.2rem] bg-gradient-to-tr from-indigo-600 to-indigo-400 text-white mb-6 shadow-lg shadow-indigo-500/30"><svg className="w-8 h-8" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/></svg></div>
                          <h1 className="text-3xl font-black tracking-tight text-slate-900 dark:text-white">Workspace</h1>
                          <p className="text-slate-500 text-sm mt-2 font-bold tracking-wide">RMS PRO LOGIN</p>
                      </div>
                      <form onSubmit={handleLogin} className="space-y-4">
                          <Input type="email" placeholder="Email Address" value={email} onChange={e => setEmail(e.target.value)} required className="!py-4" />
                          <Input type="password" placeholder="Password" value={pass} onChange={e => setPass(e.target.value)} required className="!py-4" />
                          <Button type="submit" className="w-full py-4 mt-4 text-base" loading={loading}>Sign In</Button>
                      </form>
                      {error && <div className="mt-6 p-4 bg-rose-50/80 dark:bg-rose-500/10 text-rose-600 dark:text-rose-400 text-sm rounded-2xl text-center font-bold border border-rose-100 dark:border-rose-500/20">{error}</div>}
                      <div className="mt-10 text-center text-xs text-slate-400 font-bold uppercase tracking-wider">Developed by Foyaz Chowdhury</div>
                  </div>
              </div>
          );
      }

      function AuthWrapper() {
          const [user, setUser] = useState(null); const [loading, setLoading] = useState(true);
          useEffect(() => auth.onAuthStateChanged(u => { setUser(u); setLoading(false); }), []);
          
          if (loading) return <div className="min-h-screen flex items-center justify-center bg-[#f5f5f7] dark:bg-[#000000]"><div className="w-10 h-10 border-[3px] border-indigo-500 border-t-transparent rounded-full animate-spin"></div></div>;
          return user ? <ToastProvider><App currentUser={user} /></ToastProvider> : <LoginScreen />;
      }

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<AuthWrapper />);
    </script>
  </body>
</html>
