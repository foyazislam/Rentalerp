<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0, viewport-fit=cover" />
    <title>Home/Shop RMS Pro</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script> 
    
    <script>
      tailwind.config = {
        darkMode: 'class', 
        theme: {
          extend: {
            colors: {
              indigo: {
                50: 'var(--theme-50)', 100: 'var(--theme-100)', 200: 'var(--theme-200)', 300: 'var(--theme-300)', 400: 'var(--theme-400)',
                500: 'var(--theme-500)', 600: 'var(--theme-600)', 700: 'var(--theme-700)', 800: 'var(--theme-800)', 900: 'var(--theme-900)',
              }
            },
            padding: { 'safe-bottom': 'env(safe-area-inset-bottom)' },
            animation: { 'slide-up': 'slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards' },
            keyframes: { slideUp: { '0%': { transform: 'translateY(20px)', opacity: '0' }, '100%': { transform: 'translateY(0)', opacity: '1' } } }
          }
        }
      }
    </script>

    <style>
      /* Base Styles */
      html, body { height: 100%; transition: background-color 0.4s ease, color 0.4s ease; overscroll-behavior-y: none;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; letter-spacing: -0.015em; }
      body { -webkit-tap-highlight-color: transparent; }
      
      /* Theme Variables */
      :root {
        --theme-50: #eef2ff; --theme-100: #e0e7ff; --theme-200: #c7d2fe; --theme-300: #a5b4fc; --theme-400: #818cf8;
        --theme-500: #6366f1; --theme-600: #4f46e5; --theme-700: #4338ca; --theme-800: #3730a3; --theme-900: #312e81; }

      /* Custom Scrollbars - Modernized */
      .custom-scrollbar::-webkit-scrollbar { height: 6px; width: 6px; }
      .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 10px; }
      .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
      .dark .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); }

      input[type="date"], input[type="month"] { -webkit-appearance: none; appearance: none; background-color: transparent; min-height: 46px; }
      @media print { .no-print { display: none !important; } }
    </style>
  </head>
  <body class="bg-[#f5f5f7] text-slate-800 dark:bg-[#000000] dark:text-slate-100 selection:bg-indigo-500 selection:text-white antialiased font-medium">
    <div id="root"></div>

    <script type="text/babel">
      const { useEffect, useMemo, useRef, useState, createContext, useContext } = React;
      
      /* ------------- Firebase Config ------------- */
      const firebaseConfig = {
        apiKey: "AIzaSyBR20axEzJjcoNNyGxxxvc6AZYrxPBQ6M4",
        authDomain: "homeshop-rms.firebaseapp.com",
        projectId: "homeshop-rms",
        storageBucket: "homeshop-rms.firebasestorage.app",
        messagingSenderId: "860746996508",
        appId: "1:860746996508:web:7a9360811037941725b8d9"
      };
      if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
      const db = firebase.firestore();
      const auth = firebase.auth();
      const storage = firebase.storage();

      /* ------------- Toast Context ------------- */
      const ToastContext = createContext();
      const useToast = () => useContext(ToastContext);

      const ToastProvider = ({ children }) => {
          const [toasts, setToasts] = useState([]);
          const addToast = (msg, type = 'success') => {
              const id = Date.now();
              setToasts(prev => [...prev, { id, msg, type }]);
              setTimeout(() => removeToast(id), 3000);
          };
          const removeToast = (id) => setToasts(prev => prev.filter(t => t.id !== id));
          return (
              <ToastContext.Provider value={{ addToast }}>
                  {children}
                  <div className="fixed bottom-6 left-1/2 -translate-x-1/2 z-[100] flex flex-col gap-3 pointer-events-none w-full max-w-sm px-4">
                      {toasts.map(t => (
                          <div key={t.id} className={`pointer-events-auto animate-slide-up px-5 py-3.5 rounded-2xl shadow-[0_8px_30px_rgb(0,0,0,0.12)] flex items-center justify-center gap-3 text-sm font-bold text-white backdrop-blur-xl border border-white/20 ${t.type === 'error' ? 'bg-rose-500/90' : 'bg-slate-800/90 dark:bg-slate-200/90 dark:text-slate-900'}`}>
                              <span className="text-lg">{t.type === 'error' ? '⚠️' : '✨'}</span> {t.msg}
                          </div>
                      ))}
                  </div>
              </ToastContext.Provider>
          );
      };

      /* ------------- Theme Definitions ------------- */
      const THEMES = {
        indigo: { name: 'Default', colors: { 50:'#eef2ff', 100:'#e0e7ff', 200:'#c7d2fe', 300:'#a5b4fc', 400:'#818cf8', 500:'#6366f1', 600:'#4f46e5', 700:'#4338ca', 800:'#3730a3', 900:'#312e81' }},
        blue: { name: 'Ocean', colors: { 50:'#eff6ff', 100:'#dbeafe', 200:'#bfdbfe', 300:'#93c5fd', 400:'#60a5fa', 500:'#3b82f6', 600:'#2563eb', 700:'#1d4ed8', 800:'#1e40af', 900:'#1e3a8a' }},
        emerald: { name: 'Forest', colors: { 50:'#ecfdf5', 100:'#d1fae5', 200:'#a7f3d0', 300:'#6ee7b7', 400:'#34d399', 500:'#10b981', 600:'#059669', 700:'#047857', 800:'#065f46', 900:'#064e3b' }},
        slate: { name: 'Graphite', colors: { 50:'#f8fafc', 100:'#f1f5f9', 200:'#e2e8f0', 300:'#cbd5e1', 400:'#94a3b8', 500:'#64748b', 600:'#475569', 700:'#334155', 800:'#1e293b', 900:'#0f172a' }},
      };

      /* ------------- Utilities ------------- */
      const todayStr = () => new Date().toISOString().slice(0, 10);
      const formatDisplayDate = (dateStr) => { if (!dateStr) return ""; const [y, m, d] = dateStr.split('-'); return `${d}-${m}-${y}`; };
      const currency = (n) => { const num = Number(n || 0);
      try { return num.toLocaleString(undefined, { style: "currency", currency: "BDT", minimumFractionDigits: 0 }).replace("BDT", "৳").trim(); } catch { return `৳${num.toLocaleString()}`; } };
      const formatMonth = (ym) => { if (!ym || ym.length !== 7) return "N/A"; const [year, month] = ym.split('-');
      return new Date(year, month - 1, 1).toLocaleString('default', { month: 'long', year: 'numeric' }); };
      
      const amountToWords = (n) => {
          if (typeof n !== 'number') { n = Number(n); }
          if (isNaN(n) || n <= 0) { return "Zero Taka Only"; }
          const units = ['', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine'];
          const teens = ['Ten', 'Eleven', 'Twelve', 'Thirteen', 'Fourteen', 'Fifteen', 'Sixteen', 'Seventeen', 'Eighteen', 'Nineteen'];
          const tens = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety'];
          
          function helper(num) {
              if (num === 0) return '';
              if (num < 10) return units[num] + ' ';
              if (num < 20) return teens[num - 10] + ' ';
              if (num < 100) return tens[Math.floor(num / 10)] + ' ' + helper(num % 10);
              if (num < 1000) return units[Math.floor(num / 100)] + ' Hundred ' + helper(num % 100);
              let words = '';
              if (num >= 10000000) { words += helper(Math.floor(num / 10000000)) + ' Crore '; num %= 10000000; }
              if (num >= 100000) { words += helper(Math.floor(num / 100000)) + ' Lakh '; num %= 100000; }
              if (num >= 1000) { words += helper(Math.floor(num / 1000)) + ' Thousand '; num %= 1000; }
              words += helper(num);
              return words;
          }
          let totalAmount = Math.round(n * 100) / 100;
          let taka = Math.floor(totalAmount);
          let paisa = Math.round((totalAmount - taka) * 100);
          let words = helper(taka).trim();
          if (words) words += ' Taka'; else words = '';
          if (paisa > 0) { if (words) words += ' and '; let paisaWords = helper(paisa).trim();
          if (paisaWords) words += paisaWords + ' Paisa'; else words += `${String(paisa).padStart(2, '0')}/100 Paisa`; }
          if (words) words += ' Only';
          return words.replace(/\s+/g, ' ').trim() || "Zero Taka Only";
      };

      const monthKey = (dateStr) => { const d = new Date(dateStr); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`; };
      const nextReceiptNo = (allPayments) => { const yyyymm = monthKey(new Date().toISOString());
      const prefix = `RC-${yyyymm}-`; const count = allPayments.filter((p) => (p.receiptNo || "").startsWith(prefix)).length + 1; return `${prefix}${String(count).padStart(4, "0")}`; };
      
      const exportToCSV = (data, filename) => {
          const csvContent = "data:text/csv;charset=utf-8," + data.map(e => e.join(",")).join("\n");
          const encodedUri = encodeURI(csvContent);
          const link = document.createElement("a");
          link.setAttribute("href", encodedUri);
          link.setAttribute("download", filename);
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
      };
      
      const createWhatsAppLink = (phone, tenantName, unitName, orgName, dueDay, rent) => { 
          if (!phone) return null;
          const p = phone.replace(/\D/g, ''); 
          const msg = `*Rent Reminder from ${orgName}*\n\nDear ${tenantName} (Unit: ${unitName}),\n\nYour rent of ${currency(rent)} is due by date ${dueDay}.\nPlease pay on time.\nThank you!`;
          return `https://wa.me/${p}?text=${encodeURIComponent(msg)}`; 
      };

      function escapeHTML(str) { return String(str || "").replace(/[&<>'"/]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;","\"":"&quot;","/":"&#x2F;"}[c] || c)); }
      function renderReceiptInner(org, payment, unit) { 
          const unitName = unit?.name || payment.unitId || "N/A"; 
          const formattedMonth = formatMonth(payment.forMonth); 
          const displayDate = formatDisplayDate(payment.date); 
          const displayPurpose = (payment.purpose === "Rent" || !payment.purpose) ? "Rent And Service Charge" : payment.purpose;
          return ` <div style="font-family: Times New Roman, system-ui, sans-serif; max-width: 190mm; margin: 0 auto; padding: 20px; background: white; border: 1px solid #ddd;"> <div style="text-align:center; padding-bottom:4px; border-bottom:3px solid #e2e8f0;"> <h1 style="font-size: 1.5rem; font-weight: 700; margin: 0;">${escapeHTML(org.name)}</h1> <p style="font-size: 0.65rem; color: #475569; margin: 0;">${escapeHTML(org.address)} | Phone: ${escapeHTML(org.phone)}</p> </div> <h2 style="font-size: 1rem; font-weight: 600; text-align:center; padding: 4px 0; margin: 0;">MONEY RECEIPT</h2> <div style="display:flex; justify-content:space-between; font-size: 0.7rem; border-bottom: 1px solid #e2e8f0; padding-bottom: 4px; margin-bottom: 4px;"> <span><b>Receipt #:</b> ${escapeHTML(payment.receiptNo)}</span> <span><b>Date:</b> ${escapeHTML(displayDate)}</span> </div> <table style="width:100%; font-size:14px; border-collapse: collapse;"> <tr><td style="padding:4px 0;"><b>Received With Thanks From:</b> ${escapeHTML(payment.tenant)}</td></tr> <tr> <td style="padding:4px 0;"><b>For Unit No:</b> ${escapeHTML(unitName)}</td> <td style="padding:4px 0;"><b>Purpose:</b> ${escapeHTML(displayPurpose)}</td> </tr> <tr> <td style="padding:4px 0;"><b>For The Month:</b> ${escapeHTML(formattedMonth)}</td> <td style="padding:4px 0;"><b>Method:</b> ${escapeHTML(payment.method)}</td> </tr> <tr> <td style="padding:4px 0;"><b>In Words:</b> ${amountToWords(payment.amount)}</td> <td style="padding:4px 0;"><b>Amount:</b> <b style="font-size:16px;">${currency(payment.amount)}</b></td> </tr> </table> ${payment.notes ? `<div style="margin-top:4px; font-size:10px; color:#475569;"><b>Notes:</b> ${escapeHTML(payment.notes)}</div>` : ""} <div style="height:30px;"></div> <div style="margin-top:12px; display:flex; justify-content:space-between; align-items:flex-end;"> <div style="font-size:10px; color:#334155; max-width: 50%;">${escapeHTML(org.note || "")}</div> <div style="margin-right:10px;"><div style="border-top:1px solid #94a3b8; padding-top:4px; font-size:10px; text-align:center;">Authorized Signature</div></div> </div> </div> `;
      }
      
      function renderReceiptHTML(org, payment, unit) { return `<!DOCTYPE html><html><head><meta charset="utf-8" /><title>Receipt</title><style>@media print{@page{size:A4 portrait;margin:0}body{margin:0!important;padding:0!important}.sheet{height:98mm;width:100%;box-sizing:border-box;page-break-inside:avoid;border-bottom:1px dashed #ccc;display:flex;align-items:center;justify-content:center}}body{background:white;margin:0}.sheet{background:white;margin:0 auto;max-width:210mm;display:flex;align-items:center;justify-content:center;border-bottom:1px dashed #ccc}</style></head><body><div class="sheet"><div style="width:100%;">${renderReceiptInner(org, payment, unit)}</div></div></body></html>`; }

      const classNames = (...c) => c.filter(Boolean).join(" ");
      if (!(window.crypto && window.crypto.randomUUID)) { window.crypto = window.crypto || {};
      window.crypto.randomUUID = function () { return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) { const r = (Math.random() * 16) | 0; const v = c === 'x' ? r : (r & 0x3) | 0x8; return v.toString(16); }); }; }

      /* ------------- Initial Data ------------- */
      const initialData = {
        org: { name: "Shahjahan Chowdhury Bari", address: "Bashundhara R/A, Dhaka-1230", phone: "+8801749333661", email: "info@example.com", note: "Thank you for your payment!", },
        settings: { theme: 'indigo', darkMode: false, backupUrl: "" },
        units: [ ...Array.from({ length: 5 }).map((_, i) => ({ id: `F${i + 1}`, type: "Flat", name: `Flat ${i + 1}`, rent: 15000, 
        dueDay: 5, tenant: "", tenantPhone: "", enableReminder: true, assignDate: todayStr() })), ],
        payments: [], expenses: [], otherIncomes: []
      };

      /* ------------- Cloud Storage ------------- */
      const loadData = async (uid) => { 
        try { 
            const doc = await db.doc(`erp_data/${uid}`).get();
            if (doc.exists) {
                const saved = doc.data();
                return { ...initialData, ...saved };
            }
            return initialData;
        } catch (e) { console.error(e); return initialData; } 
      };
      
      const saveData = async (data, uid) => { 
        if (!uid) return;
        try { await db.doc(`erp_data/${uid}`).set({ ...data }); } catch (e) { console.error(e); } 
      };
      
      const uploadFile = async (file, unitId, type) => { 
          const user = auth.currentUser;
          if (!user) throw new Error("Login required");
          const ref = storage.ref(`tenant_docs/${user.uid}/${unitId}/${type}/${file.name}`);
          await ref.put(file); return await ref.getDownloadURL(); 
      };

      /* ------------- Glassmorphic Components ------------- */
      const Section = ({ title, right, children, className }) => (
        <div className={classNames("bg-white/70 dark:bg-[#1c1c1e]/70 backdrop-blur-2xl rounded-[2rem] shadow-[0_8px_30px_rgb(0,0,0,0.04)] dark:shadow-[0_8px_30px_rgb(0,0,0,0.2)] border border-white/40 dark:border-white/5 p-6 md:p-8 transition-all", className)}>
          <div className="flex flex-wrap items-center justify-between mb-6 gap-2">
            <h2 className="text-xl md:text-2xl font-bold tracking-tight text-slate-900 dark:text-white">{title}</h2>
            {right}
          </div>
          {children}
        </div>
      );
      
      const Input = (props) => (
          <input {...props} className={classNames("w-full rounded-2xl border-0 px-4 py-3.5 text-sm transition-all bg-black/[0.04] text-slate-800 placeholder:text-slate-400 dark:bg-white/[0.06] dark:text-slate-100 focus:outline-none focus:ring-4 focus:ring-indigo-500/20 focus:bg-white dark:focus:bg-[#2c2c2e] shadow-inner font-medium", props.className)} />
      );
      
      const Select = (props) => (
          <div className="relative w-full">
            <select {...props} className={classNames("w-full rounded-2xl border-0 px-4 py-3.5 text-sm appearance-none transition-all bg-black/[0.04] text-slate-800 dark:bg-white/[0.06] dark:text-slate-100 focus:outline-none focus:ring-4 focus:ring-indigo-500/20 focus:bg-white dark:focus:bg-[#2c2c2e] shadow-inner font-medium cursor-pointer", props.className)} />
            <div className="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-slate-500"><svg className="h-4 w-4 fill-current opacity-70" viewBox="0 0 20 20"><path d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z"/></svg></div>
          </div>
      );
      
      const Button = ({ children, variant = "primary", className, loading, ...rest }) => {
        const styles = {
          primary: "bg-indigo-600 text-white hover:bg-indigo-500 active:bg-indigo-700 shadow-[0_8px_16px_rgb(79,70,229,0.25)] hover:shadow-[0_10px_20px_rgba(79,70,229,0.35)]",
          secondary: "bg-white/80 dark:bg-[#2c2c2e]/80 text-slate-700 dark:text-slate-200 shadow-sm border border-black/5 dark:border-white/5 hover:bg-slate-50 dark:hover:bg-[#3a3a3c] active:bg-slate-100",
          danger: "bg-rose-500 text-white hover:bg-rose-400 active:bg-rose-600 shadow-[0_8px_16px_rgb(244,63,94,0.25)] hover:shadow-[0_10px_20px_rgba(244,63,94,0.35)]",
          ghost: "bg-transparent hover:bg-black/5 dark:hover:bg-white/10 text-slate-600 dark:text-slate-300 active:bg-black/10",
        };
        return (
          <button {...rest} disabled={rest.disabled || loading} className={classNames("rounded-2xl px-5 py-3 text-sm font-bold transition-all duration-300 disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2 active:scale-[0.97]", styles[variant], className)}>
            {loading && <div className="h-4 w-4 border-2 border-current border-t-transparent rounded-full animate-spin"></div>}
            {children}
          </button>
        );
      };
      
      const Checkbox = ({ label, id, ...props }) => (
          <div className="flex items-center py-2 cursor-pointer group">
              <input type="checkbox" id={id} {...props} className="h-5 w-5 rounded-md border-gray-300 text-indigo-600 focus:ring-indigo-500 focus:ring-offset-2 cursor-pointer transition-all" />
              {label && <label htmlFor={id} className="ml-3 text-sm font-medium text-slate-700 dark:text-slate-300 cursor-pointer select-none group-hover:text-indigo-600 dark:group-hover:text-indigo-400 transition-colors">{label}</label>}
          </div>
      );
      
      const ChartComponent = ({ data, type = 'bar', title }) => {
        const canvasRef = useRef(null);
        const chartRef = useRef(null);

        useEffect(() => {
            if (!canvasRef.current) return;
            if (chartRef.current) chartRef.current.destroy();
            const isDark = document.documentElement.classList.contains('dark');
            const gridColor = isDark ? 'rgba(255,255,255,0.05)' : 'rgba(0,0,0,0.05)';
            const textColor = isDark ? '#a1a1aa' : '#71717a';

            const ctx = canvasRef.current.getContext('2d');
            chartRef.current = new Chart(ctx, {
                type: type,
                data: data,
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { position: 'bottom', labels: { color: textColor, font: { family: '-apple-system', weight: 'bold' } } }, title: { display: !!title, text: title } },
                    scales: type === 'doughnut' ? {} : {
                        y: { beginAtZero: true, border: { display: false }, grid: { color: gridColor, drawBorder: false }, ticks: { color: textColor, padding: 10 } },
                        x: { border: { display: false }, grid: { display: false }, ticks: { color: textColor, padding: 10 } }
                    },
                    elements: { bar: { borderRadius: 6, borderSkipped: false } }
                }
            });
            return () => { if (chartRef.current) chartRef.current.destroy(); };
        }, [data, type, title]);

        return <div className="w-full h-full"><canvas ref={canvasRef}></canvas></div>;
      };
      
      const Pagination = ({ totalItems, itemsPerPage, currentPage, setCurrentPage }) => {
        const pages = Math.ceil(totalItems / itemsPerPage);
        if (pages <= 1) return null;
        return (
          <div className="flex justify-end gap-2 mt-6 items-center">
            <span className="text-xs font-bold text-slate-500 mr-2">Page {currentPage} of {pages}</span>
            <Button variant="secondary" className="!py-2 !px-3 !rounded-xl" disabled={currentPage===1} onClick={()=>setCurrentPage(c=>Math.max(1,c-1))}>Prev</Button>
            <Button variant="secondary" className="!py-2 !px-3 !rounded-xl" disabled={currentPage===pages} onClick={()=>setCurrentPage(c=>Math.min(pages,c+1))}>Next</Button>
          </div>
        )
      };
      
      function FileUpload({ label, urlKey, unitId, setUnitForm, currentUrl }) {
          const [uploading, setUploading] = useState(false);
          const { addToast } = useToast();
          const handleFileChange = async (event) => {
              const file = event.target.files[0];
              if (!file) return;
              setUploading(true);
              try {
                  const type = urlKey.replace('tenant', '').replace('Nid', 'NID').replace('Agreement', 'Agreement');
                  const url = await uploadFile(file, unitId, type);
                  setUnitForm(f => ({ ...f, [`${urlKey}Url`]: url }));
                  addToast(`${label} uploaded!`);
              } catch (error) { addToast("Upload failed.", "error"); } finally { setUploading(false); }
          };
          
          return (
              <div className="space-y-2 bg-black/[0.02] dark:bg-white/[0.02] p-4 rounded-2xl border border-black/5 dark:border-white/5">
                  <div className="flex justify-between items-center"><label className="text-[10px] font-extrabold tracking-wider text-slate-500 uppercase">{label}</label> {currentUrl && <a href={currentUrl} target="_blank" className="text-xs font-bold text-indigo-500 hover:text-indigo-600">View</a>}</div>
                  <div className="flex items-center gap-2">
                      <input type="file" onChange={handleFileChange} disabled={uploading || !unitId} className="block w-full text-xs text-slate-500 file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-indigo-50 file:text-indigo-600 hover:file:bg-indigo-100 dark:file:bg-indigo-500/20 dark:file:text-indigo-300 transition-colors cursor-pointer" />
                      {uploading && <div className="h-5 w-5 border-2 border-indigo-500 border-t-transparent rounded-full animate-spin"></div>}
                  </div>
              </div>
          );
      }
      
      /* ------------- Main App ------------- */
      function App({ currentUser }) {
        const [data, setData] = useState(initialData);
        const [tab, setTab] = useState("dashboard");
        const [showReceipt, setShowReceipt] = useState(null);
        const [loading, setLoading] = useState(true);
        const [deleteRequest, setDeleteRequest] = useState(null);
        const [showSettingsPrompt, setShowSettingsPrompt] = useState(false);
        const [dueMonth, setDueMonth] = useState(() => monthKey(new Date().toISOString()));
        const { addToast } = useToast();
        const uid = currentUser?.uid;

        useEffect(() => {
            const settings = data.settings || { theme: 'indigo', darkMode: false };
            const themeKey = settings.theme || 'indigo';
            const themeColors = THEMES[themeKey]?.colors || THEMES.indigo.colors;
            const root = document.documentElement;
            Object.entries(themeColors).forEach(([shade, value]) => { root.style.setProperty(`--theme-${shade}`, value); });
            if (settings.darkMode) root.classList.add('dark'); else root.classList.remove('dark');
        }, [data.settings]);

        useEffect(() => { 
            if (!uid) return;
            setLoading(true); 
            loadData(uid).then(init => { setData(init); setLoading(false); }); 
        }, [uid]);

        useEffect(() => { 
            if (loading || !uid) return; 
            const timer = setTimeout(() => saveData(data, uid), 800); 
            return () => clearTimeout(timer); 
        }, [data, loading, uid]);

        const updateOrg = (patch) => setData(d => ({ ...d, org: { ...d.org, ...patch } }));
        const updateSettings = (patch) => setData(d => ({ ...d, settings: { ...d.settings, ...patch } }));
        
        const upsertUnit = (unit) => {
            setData(d => ({ ...d, units: d.units.some(x => x.id === unit.id) ? d.units.map(x => x.id === unit.id ? { ...x, ...unit } : x) : [...d.units, unit] }));
            addToast("Unit saved successfully");
        };
        const deleteUnit = (id) => { 
            if(!confirm("Delete this unit?")) return;
            setData(d => ({ ...d, units: d.units.filter(u => u.id !== id) })); 
            addToast("Unit deleted");
        };
        
        const isPasswordCorrect = async (password) => { 
            if (!currentUser?.email) return false;
            try { await auth.signInWithEmailAndPassword(currentUser.email, password); return true; } catch { return false; } 
        };
        
        const deletePayment = (id) => { setData((d) => ({ ...d, payments: d.payments.filter((p) => p.id !== id) })); setDeleteRequest(null); addToast("Payment deleted", "error"); };
        const deleteExpense = (id) => { setData((d) => ({ ...d, expenses: d.expenses.filter((e) => e.id !== id) })); setDeleteRequest(null); addToast("Expense deleted", "error"); };
        const addOtherIncome = (inc) => { const newInc = { ...inc, id: crypto.randomUUID() }; setData(d => ({ ...d, otherIncomes: [newInc, ...(d.otherIncomes || [])] })); addToast("Income recorded"); };
        const deleteOtherIncome = (id) => { setData((d) => ({ ...d, otherIncomes: (d.otherIncomes || []).filter((i) => i.id !== id) })); setDeleteRequest(null); addToast("Income deleted", "error"); };

        const syncToSheet = (payload) => {
          const url = data.settings?.backupUrl;
          if (!url) return;
          fetch(url, { method: "POST", mode: "no-cors", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) }).catch(e => console.error("Sheet sync error", e));
        };

        const addPayment = (p) => {
            const newPayment = { ...p, id: crypto.randomUUID(), isPrinted: false };
            setData(d => ({ ...d, payments: [newPayment, ...d.payments] }));
            addToast(`Receipt ${p.receiptNo} created`);
            syncToSheet({ type: "Income", date: p.date, amount: Number(p.amount), desc: `Rent: ${p.tenant} (${p.unitId})`, receiptNo: p.receiptNo, unit: p.unitId, tenant: p.tenant, month: p.forMonth, method: p.method });
        };
        
        const addExpense = (e) => {
            const newExpense = { ...e, id: crypto.randomUUID() };
            setData(d => ({ ...d, expenses: [newExpense, ...d.expenses] }));
            addToast("Expense recorded");
            syncToSheet({ type: "Expense", date: e.date, amount: -Math.abs(Number(e.amount)), desc: `${e.category} - ${e.vendor || 'No Vendor'}`, category: e.category, vendor: e.vendor || "", notes: e.notes || "" });
        };

        const markAsPrinted = (id) => { setData(d => ({ ...d, payments: d.payments.map(p => p.id === id ? { ...p, isPrinted: true } : p) })); };

        const totals = useMemo(() => {
            const rentIncome = data.payments.reduce((s, p) => s + Number(p.amount || 0), 0);
            const otherIncome = (data.otherIncomes || []).reduce((s, i) => s + Number(i.amount || 0), 0);
            const income = rentIncome + otherIncome;
            const expense = data.expenses.reduce((s, e) => s + Number(e.amount || 0), 0);
            return { income, expense, net: income - expense };
        }, [data.payments, data.expenses, data.otherIncomes]);

        const chartData = useMemo(() => {
            const labels = []; const incomeData = []; const expenseData = [];
            for (let i = 5; i >= 0; i--) {
                const d = new Date(); d.setMonth(d.getMonth() - i);
                const key = monthKey(d.toISOString());
                labels.push(d.toLocaleString('default', { month: 'short' }));
                const rentInc = data.payments.filter(p => (p.date || "").startsWith(key)).reduce((s, p) => s + Number(p.amount || 0), 0);
                const otherInc = (data.otherIncomes || []).filter(inc => (inc.date || "").startsWith(key)).reduce((s, inc) => s + Number(inc.amount || 0), 0);
                const exp = data.expenses.filter(e => (e.date || "").startsWith(key)).reduce((s, e) => s + Number(e.amount || 0), 0);
                incomeData.push(rentInc + otherInc); expenseData.push(exp);
            }
            return { labels, datasets: [ { label: 'Income', data: incomeData, backgroundColor: '#6366f1', borderRadius: 8 }, { label: 'Expense', data: expenseData, backgroundColor: '#f43f5e', borderRadius: 8 } ] };
        }, [data.payments, data.expenses, data.otherIncomes]);

        // Fix outstanding map to also be perfectly safe with unitId or unitName
        const outstandingMap = useMemo(() => {
            const ym = dueMonth;
            const map = {};
            data.units.forEach(u => map[u.id] = Number(u.rent) || 0);
            data.payments.filter(p => (p.forMonth || "").startsWith(ym)).forEach(p => { 
                let uId = p.unitId;
                const matchedUnitByName = data.units.find(u => u.name === p.unitId);
                if (matchedUnitByName) uId = matchedUnitByName.id;
                
                map[uId] = Math.max(0, (map[uId] || 0) - Number(p.amount || 0)); 
            });
            return map;
        }, [data.units, data.payments, dueMonth]);
        
        if (loading) return (
            <div className="min-h-screen flex flex-col items-center justify-center bg-[#f5f5f7] dark:bg-[#000000] gap-5">
                <div className="h-12 w-12 border-[3px] border-indigo-500 border-t-transparent rounded-full animate-spin"></div>
                <div className="text-slate-500 font-bold tracking-wide animate-pulse text-sm">LOADING WORKSPACE</div>
            </div>
        );
        
        return (
          <div className="min-h-screen pb-safe-bottom transition-colors duration-500">
            <header className="sticky top-0 z-30 bg-white/70 dark:bg-[#1c1c1e]/70 backdrop-blur-3xl border-b border-black/5 dark:border-white/5 shadow-[0_4px_30px_rgb(0,0,0,0.02)] no-print">
              <div className="mx-auto max-w-6xl px-4 py-4 flex items-center justify-between">
                <div className="flex items-center gap-3">
                  <div className="bg-gradient-to-tr from-indigo-600 to-indigo-400 text-white p-2 rounded-[14px] shadow-lg shadow-indigo-500/30"><svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/></svg></div>
                    <div className="font-extrabold tracking-tight text-xl text-slate-900 dark:text-white truncate">{data.org.name || "RMS Pro"}</div>
                </div>
                <div className="flex items-center gap-3">
                    <span className="hidden sm:inline-flex px-3 py-1 bg-black/5 dark:bg-white/10 rounded-full text-xs font-bold text-slate-600 dark:text-slate-300">{currentUser.email}</span>
                    <button onClick={() => auth.signOut()} className="p-2 rounded-full hover:bg-black/5 dark:hover:bg-white/10 text-slate-500 transition-colors"><svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg></button>
                </div>
              </div>
              <nav className="mx-auto max-w-6xl px-4 overflow-x-auto custom-scrollbar">
                <div className="flex gap-2 pb-4 min-w-max">
                   {[ ["dashboard", "Dashboard"], ["units", "Units"], ["payments", "History"], ["previousDues", "Previous Dues"], ["newReceipt", "+ Receipt"], ["otherIncomes", "Other Income"], ["statement", "Statement"], ["expenses", "Expenses"], ["settings", "Settings"] ].map(([key, label]) => (
                      <button key={key} onClick={() => { if (key === 'settings' && currentUser) setShowSettingsPrompt(true); else setTab(key); }}
                      className={classNames("px-5 py-2.5 rounded-full text-sm font-bold transition-all duration-300 whitespace-nowrap", tab === key ? "bg-slate-900 text-white dark:bg-white dark:text-black shadow-md" : "text-slate-600 dark:text-slate-400 hover:bg-black/5 dark:hover:bg-white/10")}>
                      {label}
                    </button>
                    ))}
                </div>
              </nav>
            </header>

            <main className="mx-auto max-w-6xl p-4 sm:p-6 lg:p-8 space-y-8 pb-32 md:pb-16 no-print">
              {tab === "dashboard" && <Dashboard totals={totals} units={data.units} outstanding={outstandingMap} chartData={chartData} expenses={data.expenses} org={data.org} dueMonth={dueMonth} setDueMonth={setDueMonth} />}
              {tab === "units" && <UnitsSection units={data.units} upsertUnit={upsertUnit} deleteUnit={deleteUnit} />}
              {tab === "payments" && <PaymentsSection payments={data.payments} units={data.units} org={data.org} onRowClick={setShowReceipt} onDelete={(id) => setDeleteRequest({ type: 'payment', id })} onPrintBulk={(ids) => { setData(d => ({ ...d, payments: d.payments.map(p => ids.includes(p.id) ? { ...p, isPrinted: true } : p) })); }} />}
              {tab === "previousDues" && <PreviousDuesSection units={data.units} payments={data.payments} org={data.org} />}
              {tab === "newReceipt" && <NewReceiptSection units={data.units} addPayment={addPayment} data={data} />}
              {tab === "otherIncomes" && <OtherIncomesSection incomes={data.otherIncomes || []} addIncome={addOtherIncome} onDelete={(id) => setDeleteRequest({ type: 'otherIncome', id })} />}
              {tab === "statement" && <Section title="Financial Statement"><StatementView payments={data.payments} expenses={data.expenses} otherIncomes={data.otherIncomes || []} org={data.org} /></Section>}
              {tab === "expenses" && <ExpensesSection expenses={data.expenses} addExpense={addExpense} onDelete={(id) => setDeleteRequest({ type: 'expense', id })} />}
              {tab === "settings" && <SettingsSection org={data.org} settings={data.settings} updateOrg={updateOrg} updateSettings={updateSettings} data={data} setData={setData} />}
            </main>

            {showReceipt && <ReceiptModal org={data.org} payment={showReceipt} unit={data.units.find(u => u.id === showReceipt.unitId)} onClose={() => setShowReceipt(null)} onPrintMark={() => markAsPrinted(showReceipt.id)} />}
            {(showSettingsPrompt || deleteRequest) && <PasswordPromptModal currentUser={currentUser} isPasswordCorrect={isPasswordCorrect} onClose={() => { setShowSettingsPrompt(false); setDeleteRequest(null); }} onSuccess={() => { 
                if (showSettingsPrompt) { setTab('settings'); setShowSettingsPrompt(false); } 
                else if (deleteRequest) { if (deleteRequest.type === 'payment') deletePayment(deleteRequest.id); else if (deleteRequest.type === 'expense') deleteExpense(deleteRequest.id); else if (deleteRequest.type === 'otherIncome') deleteOtherIncome(deleteRequest.id); } 
            }} actionLabel={showSettingsPrompt ? "Access Settings" : "Delete Record"} />}
          </div>
        );
      }

      /* ------------- Sub-Sections ------------- */
      
      function PreviousDuesSection({ units, payments, org }) {
          const currentYm = monthKey(todayStr());
          
          const duesList = useMemo(() => {
              return units.map(u => {
                  if (!u.tenant) return null; // Ignore vacant units
                  
                  let startMonth;
                  if (u.assignDate) {
                      startMonth = monthKey(u.assignDate);
                  } else {
                      // Fallback: strictly matching Unit ID (or Unit Name for legacy safety)
                      const unitPayments = payments.filter(p => (p.unitId === u.id || p.unitId === u.name) && p.forMonth);
                      if (unitPayments.length === 0) return null;
                      const monthsWithPayments = unitPayments.map(p => p.forMonth).sort();
                      startMonth = monthsWithPayments[0];
                  }
                  
                  if (!startMonth) return null;

                  let pastDueTotal = 0;
                  const missedMonths = [];
                  
                  let curr = new Date(startMonth + "-01");
                  const end = new Date(currentYm + "-01");
                  
                  // Scan from assignment date up to the PREVIOUS month
                  while (curr < end) {
                      const ym = monthKey(curr.toISOString());
                      
                      // Calculate the exact due strictly by UNIT, ignoring tenant mismatch
                      const paid = payments.filter(p => (p.unitId === u.id || p.unitId === u.name) && p.forMonth === ym)
                                           .reduce((sum, p) => sum + Number(p.amount), 0);
                                           
                      const due = Math.max(0, Number(u.rent) - paid);
                      
                      if (due > 0) {
                          pastDueTotal += due;
                          missedMonths.push({ month: ym, due });
                      }
                      
                      curr.setMonth(curr.getMonth() + 1);
                  }
                  
                  if (missedMonths.length > 0) {
                      return { unit: u, pastDueTotal, missedMonths };
                  }
                  return null;
              }).filter(Boolean);
          }, [units, payments, currentYm]);

          return (
              <div className="space-y-8 animate-slide-up">
                  <Section title="Previous Dues (Unpaid Past Months)">
                      {duesList.length === 0 ? (
                          <div className="text-center py-12 text-emerald-500 font-bold bg-emerald-50 dark:bg-emerald-500/10 rounded-2xl border border-emerald-100 dark:border-emerald-500/20 shadow-sm">
                              All active units are cleared for past months! 🎉
                          </div>
                      ) : (
                          <div className="grid gap-4">
                              {duesList.map(item => (
                                  <div key={item.unit.id} className="p-6 bg-white/50 dark:bg-[#2c2c2e]/50 rounded-[2rem] border border-rose-100 dark:border-rose-900/30 shadow-sm flex flex-col md:flex-row md:items-center justify-between gap-4 transition-transform hover:scale-[1.01]">
                                      <div className="flex items-center gap-4">
                                          <div className="h-12 w-12 rounded-full bg-rose-100 dark:bg-rose-500/20 flex items-center justify-center font-bold text-rose-600 dark:text-rose-400 text-lg shadow-inner">
                                              {item.unit.id}
                                          </div>
                                          <div>
                                              {/* Flipped hierarchy: Unit Name is now the primary header */}
                                              <div className="font-black text-lg text-slate-900 dark:text-white">{item.unit.name}</div>
                                              <div className="text-sm font-medium text-slate-500">Tenant: <span className="font-bold">{item.unit.tenant}</span> • Rent: {currency(item.unit.rent)}</div>
                                          </div>
                                      </div>
                                      
                                      <div className="flex-1 md:px-6">
                                          <div className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Missed Months ({item.missedMonths.length})</div>
                                          <div className="flex flex-wrap gap-2">
                                              {item.missedMonths.map(m => (
                                                  <span key={m.month} className="px-3 py-1 bg-rose-50 dark:bg-rose-500/10 text-rose-600 dark:text-rose-400 text-xs font-bold rounded-lg border border-rose-100 dark:border-rose-500/20 shadow-sm">
                                                      {formatMonth(m.month)}: {currency(m.due)}
                                                  </span>
                                              ))}
                                          </div>
                                      </div>

                                      <div className="text-right flex flex-col items-start md:items-end gap-3 mt-4 md:mt-0 pt-4 md:pt-0 border-t md:border-t-0 border-black/5 dark:border-white/5">
                                          <div>
                                              <div className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1 md:text-right">Total Past Due</div>
                                              <div className="text-2xl font-black text-rose-600 tracking-tight">{currency(item.pastDueTotal)}</div>
                                          </div>
                                          <a href={createWhatsAppLink(item.unit.tenantPhone, item.unit.tenant, item.unit.name, org.name, item.unit.dueDay, item.pastDueTotal)} target="_blank" className="bg-[#25D366] hover:bg-[#1DA851] text-white px-5 py-2.5 rounded-xl text-sm font-bold flex items-center gap-2 shadow-[0_4px_12px_rgba(37,211,102,0.3)] active:scale-95 transition-all w-full justify-center md:w-auto">
                                              <svg className="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.008-.57-.008-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.374-5.03c0-5.445 4.431-9.872 9.871-9.872 2.636 0 5.115 1.026 6.979 2.89 1.864 1.864 2.89 4.343 2.89 6.979 0 5.445-4.431 9.872-9.871 9.872z"/></svg> Remind Past Due
                                          </a>
                                      </div>
                                  </div>
                              ))}
                          </div>
                      )}
                  </Section>
              </div>
          );
      }

      function Dashboard({ totals, units, outstanding, chartData, expenses, org, dueMonth, setDueMonth }) {
          const dueCount = Object.values(outstanding).filter(v => v > 0).length;
          const totalDue = Object.values(outstanding).reduce((a,b) => a + Number(b), 0);
          
          const expenseCats = {};
          expenses.forEach(e => { const cat = e.category || "Uncategorized"; expenseCats[cat] = (expenseCats[cat] || 0) + Number(e.amount); });
          const pieData = { labels: Object.keys(expenseCats), datasets: [{ data: Object.values(expenseCats), backgroundColor: ['#6366f1', '#ec4899', '#10b981', '#f59e0b', '#8b5cf6', '#64748b'], borderWidth: 0, hoverOffset: 4 }] };
          
          const currentYm = monthKey(new Date().toISOString());
          const overdueUnits = units.filter(u => { 
              const bal = outstanding[u.id] || 0; 
              if (bal <= 0 || !u.enableReminder || !u.tenant) return false;
              if (dueMonth < currentYm) return true;
              return new Date().getDate() >= (Number(u.dueDay) - 2); 
          });
          const unpaidUnits = units.filter(u => (outstanding[u.id] || 0) > 0 && u.tenant);
          
          return (
              <div className="space-y-8 animate-slide-up">
                  <div className="grid grid-cols-2 lg:grid-cols-4 gap-4 sm:gap-6">
                      <StatCard label="Total Income" value={currency(totals.income)} icon="􀖀" color="text-emerald-500" />
                      <StatCard label="Total Expense" value={currency(totals.expense)} icon="􀢒" color="text-rose-500" />
                      <StatCard label="Net Profit" value={currency(totals.net)} icon="􀤆" color="text-indigo-500" />
                      <StatCard label="Total Due" value={currency(totalDue)} icon="􀇿" color="text-amber-500" sub={`${dueCount} pending for ${formatMonth(dueMonth)}`} />
                  </div>
                  <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                      <div className="lg:col-span-2 space-y-8">
                          <Section title="Cash Flow Trend" className="!p-6 h-[400px]">
                              <ChartComponent data={chartData} type="bar" />
                          </Section>
                          
                          <Section title="Unpaid Status" right={<Input type="month" value={dueMonth} onChange={e => setDueMonth(e.target.value)} className="w-40 !py-2 !rounded-full text-sm" />}>
                                <div className="space-y-3 max-h-72 overflow-y-auto custom-scrollbar pr-3">
                                  {unpaidUnits.length === 0 ? (
                                    <div className="text-center py-10 text-emerald-500 text-sm font-bold bg-emerald-50 dark:bg-emerald-500/10 rounded-2xl">All tenants have paid for {formatMonth(dueMonth)}! 🎉</div>
                                  ) : (
                                    unpaidUnits.map(u => (
                                      <div key={u.id} className="flex items-center justify-between p-4 bg-white/50 dark:bg-[#2c2c2e]/50 rounded-2xl border border-rose-100 dark:border-rose-900/30 shadow-sm transition-transform hover:scale-[1.01]">
                                          <div className="flex items-center gap-4">
                                              <div className="h-10 w-10 rounded-full bg-rose-100 dark:bg-rose-500/20 flex items-center justify-center font-bold text-rose-600 dark:text-rose-400 text-sm">{u.id}</div>
                                              <div>
                                                  <div className="font-bold text-base text-slate-900 dark:text-white">{u.name}</div>
                                                  <div className="text-xs font-medium text-slate-500">Tenant: {u.tenant || "Unknown"} • {formatMonth(dueMonth)}</div>
                                              </div>
                                          </div>
                                          <div className="text-right">
                                             <div className="text-base font-black text-rose-600">Due: {currency(outstanding[u.id])}</div>
                                             <div className="text-xs font-bold text-slate-400">by {u.dueDay}th</div>
                                          </div>
                                      </div>
                                    ))
                                  )}
                                </div>
                          </Section>

                          <Section title="Due Reminders">
                              <div className="space-y-3 max-h-72 overflow-y-auto custom-scrollbar pr-3">
                                  {overdueUnits.length === 0 ? (
                                    <div className="text-center py-10 text-slate-400 text-sm font-medium">No active reminders.</div>
                                  ) : (
                                    overdueUnits.map(u => (
                                      <div key={u.id} className="flex items-center justify-between p-4 bg-white/50 dark:bg-[#2c2c2e]/50 rounded-2xl border border-black/5 dark:border-white/5 shadow-sm">
                                          <div className="flex items-center gap-4">
                                              <div className="h-10 w-10 rounded-full bg-slate-100 dark:bg-[#3a3a3c] flex items-center justify-center font-bold text-slate-600 dark:text-slate-300">{u.id}</div>
                                              <div>
                                                  <div className="font-bold text-base text-slate-900 dark:text-white">{u.tenant}</div>
                                                  <div className="text-xs font-bold text-rose-500">Due: {currency(outstanding[u.id])}</div>
                                              </div>
                                          </div>
                                          <a href={createWhatsAppLink(u.tenantPhone, u.tenant, u.name, org.name, u.dueDay, outstanding[u.id])} target="_blank" className="bg-[#25D366] hover:bg-[#1DA851] text-white px-4 py-2 rounded-xl text-sm font-bold flex items-center gap-2 shadow-[0_4px_12px_rgba(37,211,102,0.3)] active:scale-95 transition-all">

      function PaymentsSection({ payments, units, org, onRowClick, onDelete, onPrintBulk }) {
          const [search, setSearch] = useState(""); 
          const [monthFilter, setMonthFilter] = useState(""); 
          const [currentPage, setCurrentPage] = useState(1); 
          const [selectedReceipts, setSelectedReceipts] = useState([]);
          const itemsPerPage = 10;

          const filtered = useMemo(() => { 
              let res = payments; 
              if (monthFilter) res = res.filter(p => (p.forMonth || "").startsWith(monthFilter)); 
              if (search) { 
                  const q = search.toLowerCase(); 
                  res = res.filter(p => p.receiptNo.toLowerCase().includes(q) || p.tenant.toLowerCase().includes(q)); 
              } 
              return res.sort((a,b) => new Date(b.date) - new Date(a.date)); 
          }, [payments, search, monthFilter]);
          
          const paginated = useMemo(() => filtered.slice((currentPage - 1) * itemsPerPage, (currentPage - 1) * itemsPerPage + itemsPerPage), [filtered, currentPage]);
          
          useEffect(() => setCurrentPage(1), [search, monthFilter]);

          const handlePrintSelected = () => {
              if (selectedReceipts.length === 0) return;
              const receiptsToPrint = payments.filter(p => selectedReceipts.includes(p.id));

              let combinedHtml = `<!DOCTYPE html><html><head><meta charset="utf-8" /><title>Bulk Print Receipts</title><style>@media print{@page{size:A4 portrait;margin:0}body{margin:0!important;padding:0!important}.sheet{height:98mm;width:100%;box-sizing:border-box;page-break-inside:avoid;border-bottom:1.5px dashed #888;display:flex;align-items:center;justify-content:center}.sheet:nth-child(3n){border-bottom:none;page-break-after:always}}body{background:white;margin:0}.sheet{background:white;margin:0 auto;padding:15px;max-width:210mm;border-bottom:1.5px dashed #ccc;display:flex;align-items:center;justify-content:center}</style></head><body>`;

              receiptsToPrint.forEach(payment => {
                  const unit = units.find(u => u.id === payment.unitId);
                  combinedHtml += `<div class="sheet"><div style="width:100%;">${renderReceiptInner(org, payment, unit)}</div></div>`;
              });

              combinedHtml += `</body></html>`;

              const w = window.open("", "_blank");
              w.document.write(combinedHtml);
              w.document.close();
              w.focus();

              if (onPrintBulk) onPrintBulk(selectedReceipts);

              setTimeout(() => { w.print(); setSelectedReceipts([]); }, 200);
          };

          const toggleSelectAll = (e) => {
              if (e.target.checked) {
                  setSelectedReceipts(paginated.map(p => p.id));
              } else {
                  setSelectedReceipts([]);
              }
          };

          const toggleSelect = (id) => {
              setSelectedReceipts(prev => prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]);
          };
          
          return (
              <Section title="Receipt History" right={
                  <div className="flex gap-3 items-center">
                      {selectedReceipts.length > 0 && (
                          <Button onClick={handlePrintSelected} className="!py-2 !rounded-full text-xs !bg-emerald-600 hover:!bg-emerald-500">
                              Print Selected ({selectedReceipts.length})
                          </Button>
                      )}
                      <Input type="month" value={monthFilter} onChange={e => setMonthFilter(e.target.value)} className="w-40 !py-2 !rounded-full text-sm" />
                      <Button variant="secondary" className="!py-2 !rounded-full text-xs" onClick={() => exportToCSV([["Date", "Receipt No", "Unit", "Tenant", "Month", "Amount", "Method"], ...filtered.map(p => [p.date, p.receiptNo, p.unitId, p.tenant, p.forMonth, p.amount, p.method])], `payments_${todayStr()}.csv`)}>⬇ CSV</Button>
                  </div>
              }>
                  <div className="mb-6"><Input placeholder="Search by receipt or tenant..." value={search} onChange={e => setSearch(e.target.value)} className="!rounded-2xl" /></div>
                  <div className="overflow-x-auto">
                      <table className="min-w-full text-sm whitespace-nowrap">
                          <thead className="text-left text-slate-400 font-bold border-b border-black/5 dark:border-white/5">
                              <tr>
                                  <th className="pb-4 w-10 text-center">
                                      <input type="checkbox" onChange={toggleSelectAll} checked={paginated.length > 0 && selectedReceipts.length === paginated.length} className="cursor-pointer h-4 w-4 rounded border-gray-300 text-indigo-600 focus:ring-indigo-500" />
                                  </th>
                                  <th className="pb-4">Date & Receipt</th>
                                  <th className="pb-4">Tenant & Unit</th>
                                  <th className="pb-4 text-right">Amount</th>
                                  <th className="pb-4 text-center">Action</th>
                              </tr>
                          </thead>
                          <tbody className="divide-y divide-black/5 dark:divide-white/5">
                              {paginated.map((p, i) => (
                                  <tr key={p.id} className="hover:bg-black/[0.02] dark:hover:bg-white/[0.02] transition-colors">
                                      <td className="py-4 text-center">
                                          <input type="checkbox" checked={selectedReceipts.includes(p.id)} onChange={() => toggleSelect(p.id)} className="cursor-pointer h-4 w-4 rounded border-gray-300 text-indigo-600 focus:ring-indigo-500" />
                                      </td>
                                      <td className="py-4"><div className="font-medium text-slate-900 dark:text-white">{formatDisplayDate(p.date)}</div><div className="text-xs font-mono font-bold text-indigo-500">{p.receiptNo} {p.isPrinted && <span title="Printed">✓</span>}</div></td>
                                      <td className="py-4"><div className="font-bold text-slate-800 dark:text-slate-200">{p.tenant}</div><div className="text-xs font-medium text-slate-500">{units.find(u => u.id === p.unitId)?.name} • {formatMonth(p.forMonth)}</div></td>
                                      <td className="py-4 text-right font-black text-emerald-600 tracking-tight">{currency(p.amount)}</td>
                                      <td className="py-4">
                                          <div className="flex justify-center gap-2">
                                            <Button variant="secondary" className="!p-2 !rounded-xl text-xs" onClick={() => onRowClick(p)}>Print</Button>
                                            <Button variant="ghost" className="!p-2 !text-rose-500" onClick={() => onDelete(p.id)}>✕</Button>
                                          </div>
                                      </td>
                                  </tr>
                              ))}
                          </tbody>
                      </table>
                      {filtered.length === 0 && <div className="py-12 text-center text-slate-400 font-bold">No receipts found.</div>}
                  </div>
                  <Pagination totalItems={filtered.length} itemsPerPage={itemsPerPage} currentPage={currentPage} setCurrentPage={setCurrentPage} />
              </Section>
          );
      }
